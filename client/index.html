<body>
  <div id="root">
    <noscript>
      <div style="padding: 1rem; color: #111; background: #fff">
        This app requires JavaScript enabled.
      </div>
    </noscript>
    <div id="initial-loader">
      <div class="loader-wrap">
        <div class="logo-container">
          <div class="logo-orb"></div>
          <div class="logo-ring"></div>
          <div class="logo-ring ring-2"></div>
          <svg class="logo-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="9" cy="7" r="4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>

        <h1>
          Tribbe
          <span class="tagline">Where communities come alive</span>
        </h1>

        <div class="dots">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>

      <div class="bg-effects">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="gradient-orb orb-3"></div>
      </div>
    </div>

    <style>
      * {
        box-sizing: border-box;
      }

      #initial-loader {
        position: fixed;
        inset: 0;
        background: linear-gradient(135deg, #020617 0%, #0f172a 50%, #1e1b4b 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        overflow: hidden;
      }

      .bg-effects {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .gradient-orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.3;
        animation: float 8s infinite ease-in-out;
      }

      .orb-1 {
        width: 300px;
        height: 300px;
        background: radial-gradient(circle, #8b5cf6, transparent);
        top: -150px;
        left: -150px;
        animation-delay: 0s;
      }

      .orb-2 {
        width: 400px;
        height: 400px;
        background: radial-gradient(circle, #06b6d4, transparent);
        bottom: -200px;
        right: -200px;
        animation-delay: 2s;
      }

      .orb-3 {
        width: 250px;
        height: 250px;
        background: radial-gradient(circle, #ec4899, transparent);
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        animation-delay: 4s;
      }

      .loader-wrap {
        text-align: center;
        color: white;
        animation: fadeIn 0.8s ease forwards;
        position: relative;
        z-index: 10;
      }

      .logo-container {
        position: relative;
        width: 120px;
        height: 120px;
        margin: 0 auto 32px;
      }

      .logo-orb {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: linear-gradient(135deg, #8b5cf6, #06b6d4);
        box-shadow: 
          0 0 40px rgba(139, 92, 246, 0.5),
          0 0 80px rgba(6, 182, 212, 0.3),
          inset 0 0 20px rgba(255, 255, 255, 0.2);
        animation: pulse 2s infinite ease-in-out;
      }

      .logo-ring {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 90px;
        height: 90px;
        border-radius: 50%;
        border: 2px solid rgba(139, 92, 246, 0.3);
        animation: ripple 3s infinite ease-out;
      }

      .logo-ring.ring-2 {
        width: 110px;
        height: 110px;
        border-color: rgba(6, 182, 212, 0.3);
        animation-delay: 1.5s;
      }

      .logo-icon {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        z-index: 10;
        filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.3));
        animation: iconFloat 3s infinite ease-in-out;
      }

      h1 {
        font-size: 32px;
        font-weight: 700;
        letter-spacing: 1px;
        margin: 0;
        background: linear-gradient(135deg, #ffffff, #e0e7ff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: shimmer 3s infinite linear;
      }

      .tagline {
        display: block;
        font-size: 15px;
        font-weight: 400;
        opacity: 0.7;
        margin-top: 8px;
        letter-spacing: 0.5px;
        color: #cbd5e1;
        background: none;
        -webkit-text-fill-color: #cbd5e1;
      }

      .dots {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-top: 32px;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: linear-gradient(135deg, #8b5cf6, #06b6d4);
        animation: dotBounce 1.4s infinite ease-in-out;
        box-shadow: 0 0 10px rgba(139, 92, 246, 0.5);
      }

      .dot:nth-child(1) {
        animation-delay: 0s;
      }

      .dot:nth-child(2) {
        animation-delay: 0.2s;
      }

      .dot:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes float {
        0%, 100% {
          transform: translate(0, 0);
        }
        25% {
          transform: translate(20px, -20px);
        }
        50% {
          transform: translate(-20px, 20px);
        }
        75% {
          transform: translate(20px, 10px);
        }
      }

      @keyframes pulse {
        0%, 100% {
          transform: translate(-50%, -50%) scale(1);
          box-shadow: 
            0 0 40px rgba(139, 92, 246, 0.5),
            0 0 80px rgba(6, 182, 212, 0.3),
            inset 0 0 20px rgba(255, 255, 255, 0.2);
        }
        50% {
          transform: translate(-50%, -50%) scale(1.1);
          box-shadow: 
            0 0 60px rgba(139, 92, 246, 0.7),
            0 0 100px rgba(6, 182, 212, 0.5),
            inset 0 0 30px rgba(255, 255, 255, 0.3);
        }
      }

      @keyframes ripple {
        0% {
          transform: translate(-50%, -50%) scale(0.8);
          opacity: 1;
        }
        100% {
          transform: translate(-50%, -50%) scale(1.2);
          opacity: 0;
        }
      }

      @keyframes iconFloat {
        0%, 100% {
          transform: translate(-50%, -50%) translateY(0);
        }
        50% {
          transform: translate(-50%, -50%) translateY(-4px);
        }
      }

      @keyframes dotBounce {
        0%, 80%, 100% {
          transform: scale(0.8);
          opacity: 0.5;
        }
        40% {
          transform: scale(1.2);
          opacity: 1;
        }
      }

      @keyframes shimmer {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
