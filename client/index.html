  <!-- ✅ Resource hints for faster loading -->
  <link rel="preconnect" href="https://firebasestorage.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://accounts.google.com" crossorigin />
  <link rel="preconnect" href="https://pub-235cf704af824b4f862d187c67946951.r2.dev" crossorigin />

  <link rel="dns-prefetch" href="https://accounts.google.com" />


  
</head>

<body>
  <div id="root">
    <noscript>
      <div style="padding: 1rem; color: #111; background: #fff">
        This app requires JavaScript enabled.
      </div>
    </noscript>
    <div id="initial-loader">
      <div class="loader-wrap">
        <h1>tribbe</h1>
      </div>
    </div>

    <style>
      * {
        box-sizing: border-box;
      }

      #initial-loader {
        position: fixed;
        inset: 0;
        background: #000000;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }

      .loader-wrap {
        text-align: center;
        animation: fadeIn 0.8s ease forwards;
      }

      h1 {
        font-size: 48px;
        font-weight: 300;
        letter-spacing: 8px;
        margin: 0;
        color: #e5e7eb;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        text-transform: lowercase;
        animation: subtleGlow 2s infinite ease-in-out;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes subtleGlow {
        0%, 100% {
          opacity: 0.9;
        }
        50% {
          opacity: 1;
        }
      }
    </style>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
