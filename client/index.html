<body>
  <div id="root">
    <noscript>
      <div style="padding: 1rem; color: #111; background: #fff">
        This app requires JavaScript enabled.
      </div>
    </noscript>
    <div id="initial-loader">
      <div class="loader-wrap">
        <div class="logo-orb"></div>

        <h1>
          Your Tribbe is forming
          <span>Gathering humans</span>
        </h1>

        <div class="progress-bar">
          <div class="bar"></div>
        </div>
      </div>
    </div>

    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at 30% 20%, #1e1b4b, #020617 60%);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        backdrop-filter: blur(12px);
      }

      .loader-wrap {
        text-align: center;
        color: white;
        animation: fadeIn 1s ease forwards;
      }

      .logo-orb {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        background: radial-gradient(circle, #8b5cf6, #06b6d4);
        filter: blur(8px);
        box-shadow: 0 0 60px rgba(139, 92, 246, 0.6);
        animation: pulse 2s infinite ease-in-out;
        margin: 0 auto 24px;
      }

      h1 {
        font-size: 24px;
        font-weight: 600;
        letter-spacing: 0.5px;
      }

      h1 span {
        display: block;
        font-size: 14px;
        opacity: 0.6;
        margin-top: 6px;
      }

      .progress-bar {
        width: 220px;
        height: 6px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 999px;
        overflow: hidden;
        margin: 24px auto 0;
      }

      .progress-bar .bar {
        width: 40%;
        height: 100%;
        background: linear-gradient(90deg, #8b5cf6, #06b6d4);
        animation: loading 1.5s infinite linear;
      }

      @keyframes loading {
        0% {
          transform: translateX(-100%);
        }

        100% {
          transform: translateX(250%);
        }
      }

      @keyframes pulse {

        0%,
        100% {
          transform: scale(1);
        }

        50% {
          transform: scale(1.08);
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
